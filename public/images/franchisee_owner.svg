<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.4">
    <line x1="0" y1="60" x2="640" y2="60" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="300" x2="640" y2="300" />
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
  </g>

  <!-- Glowing Map Node Network (Franchise Territory) -->
  <g id="networkNodes">
    <!-- Connecting network lines -->
    <path d="M 120 180 L 220 120 L 340 160 L 460 100 L 540 190 L 420 240 L 280 230 Z" 
          fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
    
    <!-- Central Hub Pulse -->
    <circle cx="340" cy="160" r="32" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
    <circle cx="340" cy="160" r="18" fill="#1d4ed8" opacity="0.4" />
    <circle cx="340" cy="160" r="8" fill="#60a5fa" />

    <!-- Satellite Hubs -->
    <circle cx="120" cy="180" r="6" fill="#38bdf8" />
    <circle cx="220" cy="120" r="6" fill="#38bdf8" />
    <circle cx="460" cy="100" r="6" fill="#38bdf8" />
    <circle cx="540" cy="190" r="6" fill="#38bdf8" />
    <circle cx="420" cy="240" r="6" fill="#38bdf8" />
    <circle cx="280" cy="230" r="6" fill="#38bdf8" />

    <!-- Pulse waves -->
    <circle cx="220" cy="120" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <circle cx="460" cy="100" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Executive Analytics Window Hologram -->
  <rect x="40" y="40" width="220" height="130" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" opacity="0.95" />
  <rect x="52" y="52" width="60" height="6" rx="3" fill="#60a5fa" />
  <rect x="52" y="66" width="90" height="14" rx="2" fill="#1e293b" />
  <text x="56" y="77" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">₹84.6 Cr ANNUAL</text>

  <!-- Mini Bar Chart inside Hologram -->
  <g transform="translate(52, 95)">
    <rect x="0" y="35" width="12" height="15" rx="2" fill="#3b82f6" opacity="0.5" />
    <rect x="18" y="25" width="12" height="25" rx="2" fill="#3b82f6" opacity="0.6" />
    <rect x="36" y="18" width="12" height="32" rx="2" fill="#3b82f6" opacity="0.7" />
    <rect x="54" y="10" width="12" height="40" rx="2" fill="#3b82f6" opacity="0.8" />
    <rect x="72" y="4" width="12" height="46" rx="2" fill="#60a5fa" />
    <rect x="90" y="0" width="12" height="50" rx="2" fill="#38bdf8" />
  </g>
  <path d="M 52 140 Q 100 115 155 95" fill="none" stroke="#22c55e" stroke-width="2" />
  <circle cx="155" cy="95" r="3.5" fill="#22c55e" />

  <!-- Multi-Unit Store Density Card Right -->
  <rect x="380" y="190" width="220" height="130" rx="8" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" opacity="0.95" />
  <rect x="395" y="205" width="90" height="6" rx="3" fill="#a5b4fc" />
  <text x="395" y="228" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">148 Store Network</text>

  <!-- Network Donut Gauge -->
  <circle cx="440" cy="275" r="28" fill="none" stroke="#1e293b" stroke-width="8" />
  <circle cx="440" cy="275" r="28" fill="none" stroke="#6366f1" stroke-width="8" stroke-dasharray="140, 200" stroke-linecap="round" />
  <text x="440" y="279" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">15.2%</text>
  <text x="440" y="291" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">EBITDA</text>

  <g transform="translate(485, 250)" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">
    <circle cx="0" cy="0" r="3" fill="#6366f1" />
    <text x="8" y="3">COCO: 84 Units</text>
    <circle cx="0" cy="16" r="3" fill="#38bdf8" />
    <text x="8" y="19">FOCO: 64 Units</text>
    <circle cx="0" cy="32" r="3" fill="#10b981" />
    <text x="8" y="35">98.4% Uptime</text>
  </g>

  <!-- Executive Avatar Silhouettes / Building Silhouette -->
  <g transform="translate(260, 260)" fill="#475569" opacity="0.6">
    <rect x="0" y="10" width="30" height="90" rx="3" />
    <rect x="35" y="0" width="45" height="100" rx="3" />
    <rect x="85" y="20" width="35" height="80" rx="3" />
    <!-- glowing windows -->
    <rect x="42" y="12" width="6" height="6" fill="#60a5fa" opacity="0.8" />
    <rect x="54" y="12" width="6" height="6" fill="#60a5fa" opacity="0.8" />
    <rect x="66" y="12" width="6" height="6" fill="#60a5fa" opacity="0.8" />
    <rect x="42" y="24" width="6" height="6" fill="#38bdf8" opacity="0.8" />
    <rect x="66" y="24" width="6" height="6" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Executive Badge Pill Overlay -->
  <g transform="translate(220, 20)">
    <rect x="0" y="0" width="200" height="28" rx="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8" />
    <text x="30" y="18" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">MULTI-UNIT FRANCHISE OWNER</text>
  </g>
</svg>
