<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="meshCenter" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="80%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Base Color -->
  <rect width="1920" height="1080" fill="#020617" />
  <rect width="1920" height="1080" fill="url(#meshCenter)" />
  <circle cx="380" cy="220" r="450" fill="url(#glowBlue)" />
  <circle cx="1540" cy="380" r="450" fill="url(#glowEmerald)" />

  <!-- Subtle Perspective Floor Grid -->
  <g stroke="url(#gridFade)" stroke-width="1">
    <line x1="0" y1="120" x2="1920" y2="120" />
    <line x1="0" y1="240" x2="1920" y2="240" />
    <line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="480" x2="1920" y2="480" />
    <line x1="0" y1="600" x2="1920" y2="600" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="840" x2="1920" y2="840" />
    <line x1="0" y1="960" x2="1920" y2="960" />

    <line x1="160" y1="0" x2="160" y2="1080" />
    <line x1="320" y1="0" x2="320" y2="1080" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="640" y1="0" x2="640" y2="1080" />
    <line x1="800" y1="0" x2="800" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1120" y1="0" x2="1120" y2="1080" />
    <line x1="1280" y1="0" x2="1280" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
    <line x1="1600" y1="0" x2="1600" y2="1080" />
    <line x1="1760" y1="0" x2="1760" y2="1080" />
  </g>

  <!-- Network Topology Glowing Lines & Store Hub Nodes -->
  <g opacity="0.35">
    <path d="M 280 320 L 460 240 L 720 280 L 960 190 L 1220 260 L 1480 200 L 1720 340" 
          fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,4" />
    <path d="M 460 240 L 580 440 L 860 480 L 1180 430 L 1480 200" 
          fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4" />
    <path d="M 720 280 L 860 480 L 960 190 L 1180 430 Z" 
          fill="none" stroke="#818cf8" stroke-width="1" />

    <!-- Pulsing City Store Points -->
    <!-- Lucknow Flagship Hub -->
    <circle cx="720" cy="280" r="6" fill="#38bdf8" />
    <circle cx="720" cy="280" r="18" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <text x="735" y="275" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">LUCKNOW (OUT-042)</text>

    <!-- Noida Sector 18 -->
    <circle cx="460" cy="240" r="5" fill="#34d399" />
    <text x="475" y="235" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10">NOIDA (OUT-089)</text>

    <!-- Delhi CP -->
    <circle cx="280" cy="320" r="5" fill="#34d399" />
    <text x="295" y="325" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10">DELHI CP (OUT-019)</text>

    <!-- Bengaluru Koramangala -->
    <circle cx="960" cy="190" r="6" fill="#818cf8" />
    <circle cx="960" cy="190" r="22" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.5" />
    <text x="975" y="185" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">BENGALURU (OUT-114)</text>

    <!-- Mumbai Bandra -->
    <circle cx="1220" cy="260" r="5" fill="#f59e0b" />
    <text x="1235" y="255" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10">MUMBAI (OUT-128)</text>

    <!-- Pune -->
    <circle cx="1480" cy="200" r="5" fill="#38bdf8" />
    <text x="1495" y="195" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10">PUNE (OUT-055)</text>

    <!-- Jaipur -->
    <circle cx="1720" cy="340" r="5" fill="#34d399" />
    <text x="1650" y="360" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10">JAIPUR (OUT-073)</text>
  </g>

  <!-- Ambient Light Orbs at Corners -->
  <circle cx="100" cy="980" r="280" fill="#3b82f6" opacity="0.04" />
  <circle cx="1820" cy="920" r="320" fill="#8b5cf6" opacity="0.04" />
</svg>
