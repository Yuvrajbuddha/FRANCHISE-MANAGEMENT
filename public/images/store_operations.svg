<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="storeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#storeBg)" />

  <!-- Subtle kitchen counter and tiles perspective -->
  <g stroke="#047857" stroke-width="0.7" opacity="0.3">
    <line x1="0" y1="200" x2="640" y2="200" />
    <line x1="0" y1="260" x2="640" y2="260" />
    <line x1="0" y1="320" x2="640" y2="320" />
    <line x1="100" y1="200" x2="60" y2="360" />
    <line x1="220" y1="200" x2="180" y2="360" />
    <line x1="340" y1="200" x2="300" y2="360" />
    <line x1="460" y1="200" x2="420" y2="360" />
    <line x1="580" y1="200" x2="540" y2="360" />
  </g>

  <!-- Left: POS Order Terminal & Sales Stream -->
  <g transform="translate(50, 60)">
    <!-- POS Terminal Screen -->
    <rect x="0" y="0" width="220" height="150" rx="8" fill="url(#emeraldCard)" stroke="#10b981" stroke-width="1.5" />
    <!-- Screen Header -->
    <rect x="12" y="12" width="70" height="8" rx="4" fill="#34d399" />
    <text x="12" y="38" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">STORE #OUT-042 POS</text>
    <rect x="150" y="12" width="58" height="16" rx="4" fill="#047857" />
    <text x="179" y="24" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">ONLINE</text>

    <!-- Order Rows -->
    <g transform="translate(12, 50)" font-family="system-ui, sans-serif" font-size="9" fill="#d1fae5">
      <rect x="0" y="0" width="196" height="22" rx="4" fill="#064e3b" opacity="0.7" />
      <text x="8" y="15">Truffle Burger Combo x2</text>
      <text x="188" y="15" text-anchor="end" font-weight="bold">₹840</text>

      <rect x="0" y="26" width="196" height="22" rx="4" fill="#064e3b" opacity="0.7" />
      <text x="8" y="41">Spicy Peri Fries Meal</text>
      <text x="188" y="41" text-anchor="end" font-weight="bold">₹320</text>

      <rect x="0" y="52" width="196" height="22" rx="4" fill="#064e3b" opacity="0.7" />
      <text x="8" y="67">Belgian Truffle Shake</text>
      <text x="188" y="67" text-anchor="end" font-weight="bold">₹220</text>
    </g>

    <!-- Daily Total Tally -->
    <rect x="12" y="128" width="196" height="14" rx="3" fill="#059669" />
    <text x="20" y="139" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">TODAY: 148 Orders</text>
    <text x="200" y="139" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="end">₹54,200 NET</text>

    <!-- Stand -->
    <path d="M 85 150 L 70 190 L 150 190 L 135 150 Z" fill="#0f172a" stroke="#047857" stroke-width="1" />
    <ellipse cx="110" cy="190" rx="50" ry="8" fill="#1e293b" />
  </g>

  <!-- Right: Stock Inventory & Cold Chain Chiller Monitor -->
  <g transform="translate(370, 50)">
    <!-- Inventory Monitor Box -->
    <rect x="0" y="0" width="220" height="160" rx="8" fill="url(#emeraldCard)" stroke="#059669" stroke-width="1.5" />
    <text x="14" y="24" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">INVENTORY & COLD CHAIN</text>
    <text x="14" y="38" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8">Real-Time Sensor & Stock Auditing</text>

    <!-- Chiller Temperature Meter -->
    <rect x="14" y="50" width="192" height="42" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <circle cx="36" cy="71" r="14" fill="#065f46" />
    <path d="M 36 63 L 36 71 L 41 74" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <text x="58" y="67" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">+3.8°C</text>
    <text x="58" y="80" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8">Walk-In Chiller (Par: 4°C)</text>
    <rect x="150" y="63" width="46" height="16" rx="8" fill="#065f46" />
    <text x="173" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">OPTIMAL</text>

    <!-- Stock Variance Mini Bars -->
    <g transform="translate(14, 104)" font-family="system-ui, sans-serif" font-size="8" fill="#d1fae5">
      <text x="0" y="8">Frozen Patties: 480 / 500 par</text>
      <rect x="0" y="12" width="192" height="4" rx="2" fill="#064e3b" />
      <rect x="0" y="12" width="184" height="4" rx="2" fill="#34d399" />

      <text x="0" y="30">Truffle Sauce: 84 / 100 par</text>
      <rect x="0" y="34" width="192" height="4" rx="2" fill="#064e3b" />
      <rect x="0" y="34" width="160" height="4" rx="2" fill="#fbbf24" />
    </g>
  </g>

  <!-- Crates & Fresh Supplies at Bottom -->
  <g transform="translate(290, 240)">
    <!-- Crate 1 -->
    <rect x="0" y="30" width="70" height="50" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
    <line x1="0" y1="46" x2="70" y2="46" stroke="#047857" stroke-width="1" />
    <line x1="0" y1="62" x2="70" y2="62" stroke="#047857" stroke-width="1" />
    <rect x="20" y="50" width="30" height="12" rx="2" fill="#022c22" />
    <text x="35" y="59" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">BATCH A</text>

    <!-- Crate 2 Stacked -->
    <rect x="55" y="10" width="70" height="50" rx="4" fill="#047857" stroke="#34d399" stroke-width="1.2" />
    <line x1="55" y1="26" x2="125" y2="26" stroke="#065f46" stroke-width="1" />
    <line x1="55" y1="42" x2="125" y2="42" stroke="#065f46" stroke-width="1" />
    <rect x="75" y="30" width="30" height="12" rx="2" fill="#064e3b" />
    <text x="90" y="39" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Store Pill Overlay -->
  <g transform="translate(230, 16)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#34d399" />
    <text x="30" y="18" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">ON-GROUND STORE PORTAL</text>
  </g>
</svg>
